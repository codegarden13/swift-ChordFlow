{
  "schemaVersion": 1,
  "appName": "Chordflow",
  "buildSystem": "swiftpm",
  "packagePath": ".",
  "productName": "Chordflow",
  "configuration": "release",
  "bundleName": "Chordflow.app",
  "executableName": "Chordflow",
  "infoPlist": "_scripts/Info.plist",
  "appIcon": "_scripts/AppIcon.icns",
  "swiftPMResourceBundles": [
    "swift-app-support_ABCNotationKit.bundle",
    "swift-app-support_SpecialMarkdownKit.bundle"
  ],
  "bundleDirectories": [
    {
      "source": "Help",
      "destination": "Contents/Resources/Help"
    }
  ],
  "installDirectory": "/Applications",
  "verifySignature": true
}
